name: Instalar molduras predefinidas do Codex
on:
  push:
    branches:
      - main
    paths:
      - Codex_Arcano_Molduras_Transparentes.zip
  workflow_dispatch:
permissions:
  contents: write
jobs:
  frames:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extrair as nove molduras
        run: |
          python - <<'PY'
          import os
          import zipfile
          from pathlib import Path
          bundle = Path('Codex_Arcano_Molduras_Transparentes.zip')
          if not bundle.is_file():
              raise SystemExit('Envie o arquivo Codex_Arcano_Molduras_Transparentes.zip para a raiz do repositório.')
          output = Path('assets/frames')
          output.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(bundle) as z:
              for i in range(1, 10):
                  name = f'frame-{i:02d}.png'
                  info = z.getinfo(name)
                  if info.file_size > 10_000_000:
                      raise ValueError('Imagem muito grande: '+name)
                  data = z.read(info)
                  if not data.startswith(bytes.fromhex('89504e470d0a1a0a')):
                      raise ValueError('PNG inválido: '+name)
                  (output/name).write_bytes(data)
          print('Molduras 01–09 instaladas em assets/frames/')
          PY
      - name: Publicar as imagens no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/frames/frame-*.png
          if git diff --cached --quiet; then
            echo "Molduras já instaladas"
          else
            git commit -m "assets: instalar nove molduras originais do Codex"
            git push
          fi
