name: Remasterizar 205 sprites do Codex
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/remaster_sprites.py"
      - ".github/workflows/remaster-sprites.yml"
permissions:
  contents: write
jobs:
  remaster:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar pipeline de pixel art
        run: python -m pip install --disable-pip-version-check pillow==11.3.0 numpy==2.2.6
      - name: Refazer todos os 205 sprites transparentes
        run: python tools/remaster_sprites.py --root . --expected 205
      - name: Checar o manifesto e a quantidade de artes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          folder=Path('assets/sprites-reworked')
          report=json.loads((folder/'report.json').read_text())
          assert report['total']==205
          assets=list(folder.glob('g?_???.png'))
          assert len(assets)==205, len(assets)
          for f in assets:
              with Image.open(f) as im:
                  assert im.size==(128,128), f
                  assert im.mode=='RGBA', f
                  assert im.getbbox(), f
          print('OK:',len(assets),'artes únicas RGBA de 128x128.')
          print('Removidos fundos em',report['backgrounds_removed'],'itens.')
          PY
      - name: Salvar as 205 artes no próprio repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/sprites-reworked assets/data/sprites-reworked.js
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nas imagens."
          else
            git commit -m "assets: 205 remastered pixel art sprites, transparent and individually polished"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Prévia e relatório da remasterização
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-205-sprites-remastered
          path: |
            assets/sprites-reworked/preview-*.png
            assets/sprites-reworked/report.json
          if-no-files-found: ignore
