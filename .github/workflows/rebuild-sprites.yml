name: Codex Arcano - regenerate all 205 sprites
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/rebuild_sprites.py'
      - '.github/workflows/rebuild-sprites.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python tools/rebuild_sprites.py
      - name: Commit generated transparent PNGs and originals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/sprites-reworked assets/sprites-before-restoration
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild all 205 pixel sprites from originals (192x192)"
            git push
          fi
